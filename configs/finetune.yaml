training:
  num_epochs: 20                # Max epochs 
  batch_size: 8
  learning_rate: 0.00001
  weight_decay: 0.01
  validate_every: 1             # evaluasi tiap epoch
  log_every: 100                # simpan loss train tiap 100 step
  early_stopping_patience: 3    # stop jika val loss tidak improve selama 3 epoch

data:
  max_length: 256

task:
  name: ALL              # jalankan semua 8 task GLUE (atau ganti ke salah satu)

# Daftar semua task GLUE beserta jumlah label
tasks:
  SST2:
    num_labels: 2
    type: classification
  MRPC:
    num_labels: 2
    type: classification
  QQP:
    num_labels: 2
    type: classification
  QNLI:
    num_labels: 2
    type: classification
  RTE:
    num_labels: 2
    type: classification
  WNLI:
    num_labels: 2
    type: classification
  CoLA:
    num_labels: 2
    type: classification
  MNLI:
    num_labels: 3   # matched/mismatched share head; label space 3 (entailment/neutral/contradiction)
    type: classification
  STSB:
    num_labels: 1
    type: regression

token:
  special_token_ids: [0, 1, 2, 3]  # PAD, CLS, SEP, UNK

checkpoint:
  pretrained_path: outputs/pretrain/pretrained_model.pt