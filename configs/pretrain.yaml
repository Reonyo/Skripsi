training:
  max_steps: 100000          # Total training steps (step-based, not epoch-based)
  batch_size: 128
  learning_rate: 0.0005
  weight_decay: 0.01
  warmup_steps: 10000
  rtd_loss_weight: 1.0
  gradient_clipping: 1.0

data:
  max_length: 256

token:
  mask_token_id: 4
  special_token_ids: [0, 1, 2, 3]  # PAD, CLS, SEP, UNK
